/* Layout: full-bleed WebGL stage; thin HUD overlay (nav top-left, callout right, legend bottom). Single dark look by choice. */
:root {
  color-scheme: dark;
  --bg: #05070b;
  --fg: #dfe6ee;
  --muted: #7f8b99;
  --line: rgba(200, 215, 230, 0.35);

}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); overflow: hidden; font-family: var(--mono); }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }

.hud { position: fixed; inset: 0; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px)); }
.nav { position: absolute; top: max(18px, env(safe-area-inset-top, 0px)); left: max(18px, env(safe-area-inset-left, 0px));
  font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); line-height: 1.7; }
.nav b { color: var(--fg); font-weight: 500; }
.nav .list { margin-top: 10px; display: grid; gap: 1px; }
.nav .list span { cursor: pointer; pointer-events: auto; transition: color .2s; }
.nav .list span:hover { color: var(--fg); }
.nav .list span.on { color: var(--fg); }
.nav .list span.on::before { content: "→ "; }

.callout { position: absolute; top: 22%; right: max(6%, env(safe-area-inset-right, 0px)); text-align: left; min-width: 0; max-width: 46vw; }
.callout .meta { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
.callout h1 { font-family: var(--display); font-weight: 300; font-size: clamp(28px, 4.4vw, 54px); line-height: 1; margin: 6px 0 8px; letter-spacing: 0.01em; text-wrap: balance; }
.callout .formula { font-size: 14px; color: var(--fg); font-variant-numeric: tabular-nums; }
.callout .formula sub { font-size: 0.72em; }
.callout .mass { font-size: 11px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
#leader { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }

.legend { position: absolute; left: max(18px, env(safe-area-inset-left, 0px)); bottom: max(18px, env(safe-area-inset-bottom, 0px));
  display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 11px; letter-spacing: 0.08em; color: var(--muted); max-width: calc(100% - 140px); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; box-shadow: 0 0 8px currentColor; }

.controls { position: absolute; right: max(18px, env(safe-area-inset-right, 0px)); bottom: max(14px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; align-items: flex-end; gap: 6px; pointer-events: auto; }
.controls .row { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
.controls button[aria-pressed="true"] { background: rgba(223, 230, 238, 0.16); border-color: var(--fg); }
.controls button:disabled { opacity: 0.35; cursor: not-allowed; }
.tip { position: fixed; left: 0; top: 0; z-index: 5; pointer-events: none; max-width: 260px;

.tip span { display: block; color: var(--muted); font-variant-numeric: tabular-nums; }
.controls button { font: 500 11px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg);
  background: var(--panel); border: 1px solid var(--line); padding: 8px 11px; cursor: pointer; backdrop-filter: blur(4px); }
.controls button:hover { border-color: var(--fg); }

.hint { position: absolute; left: 50%; bottom: max(56px, calc(env(safe-area-inset-bottom, 0px) + 48px)); transform: translateX(-50%);

/* hold-to-enter gate */

.gate.open { opacity: 0; visibility: hidden; pointer-events: none; }

.gate-hex .ring { fill: none; stroke: #e8eef5; stroke-width: 1.6; stroke-dasharray: 100; stroke-dashoffset: 100; filter: drop-shadow(0 0 4px rgba(200,220,255,0.7)); }

.gate-text { font: 500 11px var(--mono); letter-spacing: 0.28em; color: var(--muted); min-height: 1.2em; }

.gate.ready .gate-btn { opacity: 1; }

.frame { position: absolute; inset: max(8px, env(safe-area-inset-top, 0px)) max(8px, env(safe-area-inset-right, 0px)) max(8px, env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));

.frame i { position: absolute; width: 5px; height: 5px; background: rgba(223, 230, 238, 0.85); }

.frame i:nth-child(3) { left: -3px; bottom: -3px; } .frame i:nth-child(4) { right: -3px; bottom: -3px; }

.readout { position: absolute; top: max(20px, env(safe-area-inset-top, 0px)); right: max(22px, env(safe-area-inset-right, 0px)); text-align: right;

.readout #clock { color: var(--fg); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
.chips span { font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--fg); border: 1px solid var(--line); padding: 2px 6px; background: rgba(8, 12, 18, 0.35); }
.callout .meta { margin-top: 8px; }
.callout .formula sup { font-size: 0.72em; }
.callout h1.long { font-size: clamp(24px, 3.3vw, 42px); }
.chips #chipTopic { border-color: var(--fg); background: rgba(223, 230, 238, 0.12); }
.credit { margin-top: 14px; max-width: 220px; font-size: 9px; letter-spacing: 0.08em; text-transform: none; line-height: 1.5; color: var(--muted); opacity: 0.8; }

/* vertical progress rail + side arrows */
.rail { position: absolute; right: max(18px, env(safe-area-inset-right, 0px)); top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 6px; pointer-events: auto; }
.rail button { width: 12px; height: 16px; padding: 0 5px; border: 0; background: none; cursor: pointer; }
.rail button::before { content: ""; display: block; width: 2px; height: 100%; background: rgba(200, 215, 230, 0.28); transition: background .3s; }
.rail button.on { height: 34px; }
.rail button.on::before { background: var(--fg); box-shadow: 0 0 8px rgba(223, 230, 238, 0.6); }
.rail button:hover::before { background: rgba(223, 230, 238, 0.7); }
.rail button:focus-visible { outline: 1px solid var(--fg); }
.arrow { position: absolute; top: 50%; transform: translateY(-50%); pointer-events: auto; background: none; border: 0; color: var(--muted);
  font: 300 22px var(--display); padding: 10px; cursor: pointer; transition: color .2s; }
.arrow:hover { color: var(--fg); }
.arrow:focus-visible { outline: 1px solid var(--fg); }
.arrow.left { left: calc(50% - min(34vw, 380px)); } .arrow.right { left: calc(50% + min(34vw, 380px) - 40px); }

  .nav .list { display: none; }

  .legend { bottom: max(120px, calc(env(safe-area-inset-bottom, 0px) + 116px)); max-width: none; right: 18px; }

<script>
/* Hold-to-enter gate: dotted benzene ring + decoding loader text. The 3D scene calls labGate.ready(fn) when it has loaded. */
(() => {
  const gate = document.getElementById("gate"), text = document.getElementById("gateText"), btn = document.getElementById("gateBtn");
  const ring = document.getElementById("hexRing"), track = document.getElementById("hexTrack"), dots = document.getElementById("hexDots");
  const NS = "http://www.w3.org/2000/svg";
  const hex = r => Array.from({ length: 6 }, (_, k) => { const a = Math.PI / 180 * (60 * k - 90); return [r * Math.cos(a), r * Math.sin(a)]; });
  const outer = hex(54).map(p => p.join(",")).join(" ");
  track.setAttribute("points", outer); ring.setAttribute("points", outer);
  const addDot = (x, y, r) => { const c = document.createElementNS(NS, "circle"); c.setAttribute("cx", x.toFixed(2)); c.setAttribute("cy", y.toFixed(2)); c.setAttribute("r", r);
    c.style.animationDelay = (Math.random() * 2.4).toFixed(2) + "s"; dots.appendChild(c); };
  const v = hex(40);
  for (let k = 0; k < 6; k++) { const [x0, y0] = v[k], [x1, y1] = v[(k + 1) % 6]; for (let s = 0; s < 8; s++) addDot(x0 + (x1 - x0) * s / 8, y0 + (y1 - y0) * s / 8, 1.3); }
  for (let s = 0; s < 30; s++) { const a = s / 30 * Math.PI * 2; addDot(Math.cos(a) * 24, Math.sin(a) * 24, 0.9); }   // aromatic ring
  const CH = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#%<>/+=";
  const rnd = () => CH[(Math.random() * CH.length) | 0];
  let ready = false, onEnter = null, t0 = performance.now();
  (function loader(now) {             // LOADING keeps decoding in a loop until the scene is ready
    if (ready) return;
    const word = "LOADING", p = ((now - t0) % 1500) / 1100;
    text.textContent = [...word].map((c, i) => i < p * word.length ? c : rnd()).join("");
    requestAnimationFrame(loader);
  })(t0);
  function decodeTo(word) {
    const s = performance.now();
    (function step(now) { const p = Math.min(1, (now - s) / 700);
      text.textContent = [...word].map((c, i) => c === " " || i < p * word.length ? c : rnd()).join("");
      if (p < 1) requestAnimationFrame(step); })(s);
  }
  // hold logic
  let holding = false, prog = 0, last = performance.now(), done = false;
  const down = e => { if (!ready || done) return; holding = true; if (e && e.preventDefault) e.preventDefault(); };
  const up = () => { holding = false; };
  gate.addEventListener("pointerdown", down);
  addEventListener("pointerup", up); addEventListener("pointercancel", up); gate.addEventListener("pointerleave", up);
  btn.addEventListener("keydown", e => { if ((e.key === " " || e.key === "Enter") && !e.repeat) { e.preventDefault(); down(); } });
  btn.addEventListener("keyup", e => { if (e.key === " " || e.key === "Enter") up(); });
  btn.addEventListener("click", e => e.preventDefault());
  (function tick(now) {
    const dt = Math.min(1, (now - last) / 1000); last = now;
    prog = Math.max(0, Math.min(1, prog + (holding ? dt / 1.1 : -dt / 0.4)));
    ring.style.strokeDashoffset = (100 - prog * 100).toFixed(2);
    if (prog >= 1 && !done) {
      done = true; gate.classList.add("open");
      if (onEnter) onEnter();
      setTimeout(() => { gate.hidden = true; }, 1400);
      return;
    }
    requestAnimationFrame(tick);
  })(last);
  window.labGate = { ready(fn) { ready = true; onEnter = fn; decodeTo("SYSTEMS READY"); gate.classList.add("ready"); try { btn.focus({ preventScroll: true }); } catch (e) {} } };
})();
</script>

/* ---------- UI ---------- */
const $ = id => document.getElementById(id);

// formula with subscripts; a trailing charge such as "-2" becomes a superscript "2−"

/* ---------- transitions ---------- */
const TRANSITIONS = ["fountain", "explode", "vortex", "build", "sweep"];
let current = -1, clock = 0, kickMode = "fountain", lastTransition = "";
function retarget(mode) {

    let r;

    else if (mode === "explode") r = 0.7 + Math.random() * 1.6;                              // bursts out, falls back in
    else if (mode === "vortex") r = 0.8 + Math.hypot(x, z) / maxRad * 1.4 + Math.random() * 0.4; // spins up, settles from the axis out

}
/* decoding text: characters scramble, then settle left to right */
const SCR = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#%&*+=<>";
function decode(el, text, html, dur = 650) {

  const start = performance.now(), chars = [...text];
  const step = now => {
    if (el._dec !== id) return;
    const p = Math.min(1, (now - start) / dur), n = Math.floor(p * chars.length);
    el.textContent = chars.map((c, i) => i < n || c === " " ? c : SCR[(Math.random() * SCR.length) | 0]).join("");
    if (p < 1) requestAnimationFrame(step); else if (html) el.innerHTML = html; else el.textContent = text;
  };

}
const COURSE_TAG = "CHM 2211";

const STYLE_CHIPS = { ball: "Ball & stick", space: "Space-filling", wire: "Wireframe" };
const rail = $("rail");
MOLECULES.forEach((m, i) => {

/* ---------- pointer ---------- */
const ndc = new THREE.Vector2(9, 9), ray = new THREE.Raycaster();
const plane = new THREE.Plane(), hit = new THREE.Vector3(), mLocal = new THREE.Vector3(), mPrev = new THREE.Vector3();
let pointerIn = false, dragging = false, px = 0, py = 0, mVel = new THREE.Vector3();
function setPointer(e) { px = e.clientX; py = e.clientY; ndc.set(px / innerWidth * 2 - 1, -(py / innerHeight) * 2 + 1); pointerIn = true;
  $("xy").textContent = `X ${(px / innerWidth).toFixed(3)} · Y ${(py / innerHeight).toFixed(3)}`; }

$("arrowNext").addEventListener("click", () => $("next").click());
/* live clock */
const CLOCK_PLACE = "Daytona Beach", CLOCK_TZ = "America/New_York";
const clockFmt = new Intl.DateTimeFormat("en-GB", { timeZone: CLOCK_TZ, hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
const tickClock = () => { $("clock").textContent = clockFmt.format(new Date()) + " " + CLOCK_PLACE; };

/* ---------- hover: which atom, bond or lone pair is under the pointer ---------- */

let hoverKey = "";
function hoverTest() {
  if (!pointerIn || dragging) return null;

function tipHTML(h) {

/* ---------- leader line from molecule to label ---------- */

/* ---------- loop ---------- */
// before entering: show molecule 1's info; the particles wait at the LED ceiling
let entered = false;
current = 0;
pick = sampleMolecule(MOLECULES[0], nextTgt, nextCol);

if (HAS_TABLE) { drawTable(MOLECULES[0]); document.fonts?.ready.then(() => drawTable(MOLECULES[current])); }

  lastSwitch = clock; userTouched();
  $("name").dataset.v = ""; updateInfo();
}
let last = performance.now(), perfT = 0, perfF = 0;
const inv = new THREE.Matrix4();
